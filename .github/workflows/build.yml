name: Build

concurrency:
    group: piliplus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
            - "docs/**"
            - "LICENSE"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

# Default least privilege; jobs that publish releases/artifacts elevate below.
permissions:
    contents: read

jobs:
    # Phase B soft quality gate: reports analyze/test; does not hard-block the
    # matrix when the tree already has pre-existing analyzer debt.
    quality:
        name: Analyze & Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Pub get
              run: flutter pub get

            - name: Analyze
              id: analyze
              continue-on-error: true
              run: flutter analyze

            - name: Test (if present)
              continue-on-error: true
              run: |
                  if compgen -G "test/**/*_test.dart" > /dev/null || compgen -G "test/*_test.dart" > /dev/null; then
                    flutter test
                  else
                    echo "No tests; skip"
                  fi

            - name: Analyze status (soft gate)
              run: |
                  if [ "${{ steps.analyze.outcome }}" != "success" ]; then
                    echo "::warning::flutter analyze reported issues (soft gate; builds still run). Harden when tree is clean."
                  else
                    echo "flutter analyze clean"
                  fi

    android:
        needs: quality
        if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request') || github.event.inputs.build_android == 'true') }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/*.gradle*
                      android/**/gradle-wrapper.properties
                      pubspec.lock

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              if: ${{ github.event_name == 'workflow_dispatch' }}
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  # Phase B: PR builds arm64-only for speed; dispatch/release keep full split-per-abi.
                  flutter build apk --release --split-per-abi --target-platform android-arm64 --android-project-arg dev=1 --pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    [ -e "$file" ] || continue
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  files: PiliPlus_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk
                  if-no-files-found: warn

            - name: 上传
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliPlus_android_*_armeabi-v7a.apk

            - name: 上传
              if: ${{ github.event_name == 'workflow_dispatch' }}
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliPlus_android_*_x86_64.apk

    ios:
        needs: quality
        if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request') || github.event.inputs.build_ios == 'true') }}
        uses: ./.github/workflows/ios.yml
        permissions:
            contents: write
            actions: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        needs: quality
        if: ${{ always() && !cancelled() && github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions:
            contents: write
            actions: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        needs: quality
        if: ${{ always() && !cancelled() && ((github.event_name == 'pull_request') || github.event.inputs.build_win_x64 == 'true') }}
        uses: ./.github/workflows/win_x64.yml
        permissions:
            contents: write
            actions: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        needs: quality
        if: ${{ always() && !cancelled() && github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions:
            contents: write
            actions: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
